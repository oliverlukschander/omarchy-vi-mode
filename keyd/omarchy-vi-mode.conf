# Omarchy Vi Mode (default snapshot: Caps layer, no swap, no resize).
# install.sh generates /etc/keyd/omarchy-vi-mode.conf from
# ~/.config/omarchy/oliverlukschander.vi-mode.json instead of copying this file.
# Caps Lock is a hold-layer, not Caps Lock. Tap does nothing.
# Hold Caps + h/j/k/l to send real arrow keys (every app, not just Hyprland).

[ids]
*

[main]
capslock = layer(nav)

[nav]
h = left
j = down
k = up
l = right

[nav+shift]
h = S-left
j = S-down
k = S-up
l = S-right

[nav+control]
h = C-left
j = C-down
k = C-up
l = C-right

[nav+control+shift]
h = C-S-left
j = C-S-down
k = C-S-up
l = C-S-right
